services:
  postgres:
    image: postgres:16-alpine
    container_name: desserting-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desserting}
      POSTGRES_USER: ${POSTGRES_USER:-desserting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desserting_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desserting_user} -d ${POSTGRES_DB:-desserting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: desserting-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-desserting_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-desserting_chat}
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: desserting-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desserting-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-desserting}
      - POSTGRES_USER=${POSTGRES_USER:-desserting_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-desserting_secret_2026}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-desserting_chat}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-desserting_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-ZGVzc2VydGluZy1zZWNyZXQta2V5LTIwMjYtZGFuZGl0aG9uLWJhY2tlbmQtand0LXRva2VuLXNlY3VyZQ==}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,https://desserting.vercel.app,https://desserting-web.vercel.app}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  redis_data:
