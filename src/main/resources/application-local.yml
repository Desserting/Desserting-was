server:
  port: ${PORT:8080}

spring:
  # PostgreSQL (RDB - Core Domain)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:desserting}
    username: ${POSTGRES_USER:desserting_user}
    password: ${POSTGRES_PASSWORD:desserting_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  # MongoDB (NoSQL - Chat Messages)
  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:desserting_admin}:${MONGO_INITDB_ROOT_PASSWORD:mongo_secret_2026}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:desserting_chat}?authSource=admin

    # Redis (In-Memory - STOMP Pub/Sub & Presence & Cache)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.desserting.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
